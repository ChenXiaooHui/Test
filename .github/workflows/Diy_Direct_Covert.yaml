name: Clash RuleSet Auto Convert to Sing-box
run-name: Auto convert Diy_Direct.yaml to sing-box rule-set json
on:
  push:
    paths:
      - 'Diy_Direct.yaml'
  workflow_dispatch: # 支持网页手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 关键权限，允许bot提交生成的json
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run convert script
        run: |
          python << 'EOF'
          import yaml, json
          clash_file = "Diy_Direct.yaml"
          sb_file = "Diy_Direct.json"

          with open(clash_file, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          payload = data.get("payload", [])

          # 自动去重
          unique_lines = list(dict.fromkeys(payload))
          sb_rules = []
          for line in unique_lines:
              typ, val = line.split(",",1)
              if typ == "DOMAIN":
                  sb_rules.append({"domain":[val]})
              elif typ == "DOMAIN-SUFFIX":
                  sb_rules.append({"domain_suffix":[val]})
              elif typ == "DOMAIN-KEYWORD":
                  sb_rules.append({"domain_keyword":[val]})
              elif typ == "IP-CIDR":
                  sb_rules.append({"ip_cidr":[val]})
              elif typ == "IP-CIDR6":
                  sb_rules.append({"ip_cidr6":[val]})

          sb_out = {
            "version":1,
            "rules": sb_rules
          }
          with open(sb_file, "w", encoding="utf-8") as f:
              json.dump(sb_out, f, ensure_ascii=False, indent=2)
          print(f"Converted OK, removed duplicates -> {sb_file}")
          EOF

      - name: Commit & Push generated json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Diy_Direct.json
          if git diff --quiet --cached; then
            echo "No change, skip commit"
          else
            git commit -m "Auto update sing-box ruleset from Diy_Direct.yaml"
            git push
          fi
